<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Mapa pessoal para registrar os países que você já visitou." />
    <title>Meu Mapa de Viagens</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="page-shell">
      <header class="site-header">
        <section class="stats" aria-label="Resumo das viagens">
          <div class="stat-main">
            <span id="visited-count">0</span>
            <p>países<br />visitados</p>
          </div>
          <div class="progress-track" aria-hidden="true">
            <div id="progress-bar"></div>
          </div>
          <p id="world-percent" class="percentage">0% do mundo explorado</p>
        </section>
      </header>

      <section class="map-card">
        <div id="world-map" aria-label="Mapa-múndi interativo"></div>
      </section>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/topojson-client@3/dist/topojson-client.min.js"></script>
    <script src="countries.js"></script>
    <script src="script.js"></script>
  </body>
</html>
